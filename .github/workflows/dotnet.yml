name: Build and Release .NET 8 Console App

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release

    - name: Publish executable
      run: dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -o ./publish

    - name: Zip published output
      run: Compress-Archive -Path ./publish/* -DestinationPath ./CheckIfEmailExists.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./CheckIfEmailExists.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
